<footer class="site-footer">
  <div class="site-footer__inner">
    <section class="site-footer__callout" aria-labelledby="footer-heading">
      <p *ngIf="content.showEyebrow && content.eyebrowText" class="site-footer__eyebrow">
        {{ content.eyebrowText }}
      </p>

      <h2 id="footer-heading" class="site-footer__heading">{{ content.headerText }}</h2>

      <p *ngIf="content.showBody && content.bodyText" class="site-footer__body">
        {{ content.bodyText }}
      </p>

      <button class="site-footer__button" type="button">
        <svg *ngIf="content.buttonIcon === 'mail' || content.buttonIcon === 'mail-arrow'"
             class="site-footer__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <span>{{ content.buttonText }}</span>

        <svg *ngIf="content.buttonIcon === 'arrow' || content.buttonIcon === 'mail-arrow'"
             class="site-footer__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </button>
    </section>

    <div class="site-footer__bottom">
      <div>
        <p class="site-footer__brand">TC.</p>
        <p class="site-footer__tagline">Built with curiosity.</p>
        <p class="site-footer__copyright">© {{ currentYear }} · All rights reserved.</p>
      </div>

      <nav class="site-footer__socials" aria-label="Social links">
        <a *ngIf="content.socialLinks.twitch; else twitchIcon" [href]="content.socialLinks.twitch"
           target="_blank" rel="noopener noreferrer" aria-label="Twitch">
          <ng-container *ngTemplateOutlet="twitchSvg"></ng-container>
        </a>
        <ng-template #twitchIcon><span role="img" aria-label="Twitch"><ng-container
          *ngTemplateOutlet="twitchSvg"></ng-container></span></ng-template>
        <ng-template #twitchSvg>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 3h18v12l-5 5h-4l-3 3v-3H6V7l-2-4Zm4 3v11h4v2l2-2h4l3-3V6H8Zm4 2h2v5h-2V8Zm5 0h2v5h-2V8Z"
                  fill="currentColor"/>
          </svg>
        </ng-template>

        <a *ngIf="content.socialLinks.github; else githubIcon" [href]="content.socialLinks.github"
           target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <ng-container *ngTemplateOutlet="githubSvg"></ng-container>
        </a>
        <ng-template #githubIcon><span role="img" aria-label="GitHub"><ng-container
          *ngTemplateOutlet="githubSvg"></ng-container></span></ng-template>
        <ng-template #githubSvg>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.77-.24.77-.54v-2.1c-3.13.68-3.79-1.33-3.79-1.33-.5-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.12.08 1.71 1.16 1.71 1.16 1 .7 2.62.5 3.26.38.1-.73.39-1.23.7-1.52-2.5-.28-5.13-1.25-5.13-5.55 0-1.22.44-2.22 1.16-3-.12-.28-.5-1.42.11-2.96 0 0 .95-.3 3.08 1.15a10.7 10.7 0 0 1 5.6 0c2.14-1.45 3.08-1.15 3.08-1.15.62 1.54.23 2.68.12 2.96.72.78 1.15 1.78 1.15 3 0 4.31-2.63 5.26-5.14 5.54.4.35.75 1.03.75 2.08v3.08c0 .3.2.65.78.54A11.2 11.2 0 0 0 12 .8Z"
              fill="currentColor"/>
          </svg>
        </ng-template>

        <a *ngIf="content.socialLinks.email; else emailIcon" [href]="'mailto:' + content.socialLinks.email"
           aria-label="Email">
          <ng-container *ngTemplateOutlet="emailSvg"></ng-container>
        </a>
        <ng-template #emailIcon><span role="img" aria-label="Email"><ng-container
          *ngTemplateOutlet="emailSvg"></ng-container></span></ng-template>
        <ng-template #emailSvg>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round"/>
          </svg>
        </ng-template>

        <a *ngIf="content.socialLinks.linkedin; else linkedinIcon" [href]="content.socialLinks.linkedin"
           target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <ng-container *ngTemplateOutlet="linkedinSvg"></ng-container>
        </a>
        <ng-template #linkedinIcon><span role="img" aria-label="LinkedIn"><ng-container
          *ngTemplateOutlet="linkedinSvg"></ng-container></span></ng-template>
        <ng-template #linkedinSvg>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M5.16 3a2.16 2.16 0 1 0 0 4.32 2.16 2.16 0 0 0 0-4.32ZM3.3 9h3.72v12H3.3V9Zm5.95 0h3.56v1.64h.05c.5-.94 1.7-1.93 3.5-1.93 3.74 0 4.43 2.46 4.43 5.66V21h-3.72v-5.88c0-1.4-.03-3.2-1.95-3.2-1.96 0-2.26 1.52-2.26 3.1V21H9.25V9Z"
              fill="currentColor"/>
          </svg>
        </ng-template>
      </nav>
    </div>
  </div>
</footer>
